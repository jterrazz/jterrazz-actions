name: Mutation

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install (leave empty to skip)
        default: "24"
        type: string
      timeout-minutes:
        description: How long the run may take; a first run measures every mutant, the next ones only what changed
        default: 360
        type: number

jobs:
  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Restore build artifacts
        id: artifacts
        uses: actions/cache/restore@v4
        with:
          path: .artifacts
          # validate.yaml's keys: the incremental file Stryker keeps under
          # .artifacts/stryker/ comes back with the rest, so a run measures
          # only the mutants whose source or tests changed since the last.
          key: artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}
          restore-keys: |
            artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}-
            artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-
            artifacts-${{ runner.os }}-

      - name: Mutation
        # Fails when the score falls below the floor the repository
        # committed in .jterrazz/baseline.json; a score above it raises the
        # floor in this checkout only, which the run never commits.
        run: make mutation

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-report
          path: .artifacts/stryker/report.html
          if-no-files-found: ignore

      - name: Save build artifacts
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .artifacts
          key: ${{ steps.artifacts.outputs.cache-primary-key }}-${{ github.run_id }}
