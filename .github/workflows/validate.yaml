name: Validate

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install (leave empty to skip)
        default: ""
        type: string

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test
