name: Validate

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install (leave empty to skip)
        default: ""
        type: string
      browsers:
        description: Provision Playwright browsers before testing (chromium, cached by lockfile version)
        default: false
        type: boolean

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Build
        run: make build

      - name: Resolve Playwright version
        if: inputs.browsers
        id: playwright
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/playwright'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: inputs.browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: inputs.browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: make lint

      - name: Test
        run: make test
