name: Validate

# hazard: the old name of check.yaml, kept only for package-typescript, which still calls it; delete
# it once that caller moves to check.yaml (docs/guides/develop.md).

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install (empty skips it)
        default: "24"
        type: string
      go-version:
        description: Go version to install (empty skips it)
        default: ""
        type: string
      browsers:
        description: Provision Playwright chromium before Test, cached by the version the lockfile names
        default: false
        type: boolean
      mutation:
        description: Run the Makefile's `mutation` target after Test
        default: true
        type: boolean
      dockerfile:
        description: The Dockerfile hadolint reads when it exists
        default: "Dockerfile"
        type: string

# invariant: a newer run cancels the one it makes useless, and only that one: a pull request's,
# whose next run gates the same base, or a push to a branch other than the default. A push to the
# default branch hands mutation the range since the commit before it, which no later run measures
# again, so it is never cancelled: it queues in a group of its own commit. The `check-` prefix
# keeps the group apart from any group the caller's workflow holds, which would deadlock.
concurrency:
  group: validate-${{ (github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch)) && format('{0}-{1}', github.workflow, github.ref) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref_name != github.event.repository.default_branch) }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-26.04-arm
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # value: the whole history only for mutation, which diffs against the commit the push or
          # the pull request started from; every other run needs the one commit.
          fetch-depth: ${{ inputs.mutation && (github.event_name == 'push' || github.event_name == 'pull_request') && '0' || '1' }}

      - name: Check
        uses: jterrazz/studio-actions/actions/check@main
        with:
          node-version: ${{ inputs.node-version }}
          go-version: ${{ inputs.go-version }}
          browsers: ${{ inputs.browsers }}
          mutation: ${{ inputs.mutation }}
          dockerfile: ${{ inputs.dockerfile }}
