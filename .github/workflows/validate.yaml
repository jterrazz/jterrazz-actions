name: Validate

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install (leave empty to skip)
        default: "24"
        type: string
      browsers:
        description: Provision Playwright browsers before testing (chromium, cached by lockfile version)
        default: false
        type: boolean
      mutation:
        description: Run the Makefile's `mutation` target after Test (release-npm passes false; release-docker forwards its caller's)
        default: true
        type: boolean

# invariant: only a pull request, or a push to a branch other than the default,
# shares a group a newer run cancels: its successor gates the same base, or a
# branch nothing deploys. A push to the default branch hands mutation the range
# since the commit before it, which no later run measures again, and a release
# (`mutation: false`, a tag, a release event) must finish, so each of those
# runs alone in a group of its own run id. The `validate-` prefix keeps the
# group apart from any group the caller's workflow holds, which would deadlock.
concurrency:
  group: validate-${{ github.workflow }}-${{ (inputs.mutation && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name != github.event.repository.default_branch))) && github.ref || github.run_id }}
  cancel-in-progress: ${{ inputs.mutation && (github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref_name != github.event.repository.default_branch)) }}

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # invariant: the mutation step diffs the tree against the commit the push or
          # the pull request started from.
          fetch-depth: 0

      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          # outside: setup-node's npm cache fails a repository with no package-lock.json
          # (a gateway that only runs the toolchain through npx), so only a lockfile asks for it.
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Restore build artifacts
        id: artifacts
        uses: actions/cache/restore@v4
        with:
          path: .artifacts
          # invariant: every run saves under its own run_id, so the fallbacks are
          # what actually restores: this branch's most recent run first,
          # then any branch's on the same lockfile (main, in practice),
          # then any lockfile's. A repo that writes nothing under
          # .artifacts simply misses, and a stale restore on such a repo
          # is inert: no target reads it.
          key: artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}
          restore-keys: |
            artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}-
            artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-
            artifacts-${{ runner.os }}-

      - name: Build
        run: make build

      - name: Resolve Playwright version
        if: inputs.browsers
        id: playwright
        # invariant: a caller's toolchain decides which lockfile exists, so try each in
        # turn rather than assuming npm, so bun and pnpm repos cache the
        # right browser build instead of silently skipping the cache.
        run: |
          version=""
          if [ -f package-lock.json ]; then
            version=$(node -p "require('./package-lock.json').packages['node_modules/playwright']?.version || ''")
          fi
          if [ -z "$version" ] && [ -f bun.lock ]; then
            version=$(grep -oE '"playwright@[^"]+"' bun.lock | head -1 | sed -E 's/"playwright@([^"]+)"/\1/')
          fi
          if [ -z "$version" ] && [ -f pnpm-lock.yaml ]; then
            version=$(grep -oE '/?playwright@[0-9][^:[:space:]]*' pnpm-lock.yaml | head -1 | sed -E 's#.*playwright@##')
          fi
          if [ -z "$version" ]; then
            echo "::error::browsers: true but no lockfile (package-lock.json, bun.lock, pnpm-lock.yaml) names a playwright version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: inputs.browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: inputs.browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Resolve the mutation range
        if: inputs.mutation
        id: since
        uses: jterrazz/jterrazz-actions/actions/mutation-since@main

      - name: Mutation
        # invariant: only a Makefile with a `mutation` target runs it, and only when the
        # caller leaves `mutation` on. The toolchain runs the same way as on
        # any machine: it reuses what the report in the restored .artifacts/
        # still proves, and a run that restores no report runs cold by
        # itself. release-npm turns it off, since the push or the pull
        # request that brought its commit gated it already; release-docker
        # turns it off unless its caller asks, as a Docker app whose push to
        # main is its release does.
        # The whole suite measures the lines this push or pull request
        # changed, since the commit mutation-since resolves.
        # A change that touches only Markdown or the manual (the root docs/)
        # gives mutation nothing to measure, so it skips; an event with no
        # commit to diff from (a schedule, a dispatch, a release) always runs.
        if: inputs.mutation
        env:
          SINCE: ${{ steps.since.outputs.since }}
        run: |
          if grep -q '^mutation:' Makefile; then
            if [ -n "$SINCE" ]; then
              changed=$(git diff --name-only "$SINCE" HEAD)
            fi
            if [ -n "$SINCE" ] && ! grep -qvE '\.md$|^docs/' <<< "$changed"; then
              echo "The change since $SINCE touches only Markdown and docs/: mutation has nothing to measure."
              exit 0
            fi
            TYPESCRIPT_MUTATION_SINCE="$SINCE" make mutation
          fi

      - name: Save build artifacts
        # value: always(): a red run still compiled and still wrote a tsc
        # buildinfo, and the retry that follows is exactly when the warm
        # tree is worth most. No cache-hit guard is needed: the run_id
        # below makes this key new on every run, so it is never a hit.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .artifacts
          # invariant: the restore step's own key, so install steps that touch a
          # lockfile between the two cannot shift the hash under us,
          # plus the run_id, because a cache key is immutable once
          # written and a buildinfo changes with every commit. One entry
          # per run keeps the cache tracking HEAD; the restore's first
          # fallback picks the newest.
          key: ${{ steps.artifacts.outputs.cache-primary-key }}-${{ github.run_id }}
