name: Validate

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install (leave empty to skip)
        default: "24"
        type: string
      browsers:
        description: Provision Playwright browsers before testing (chromium, cached by lockfile version)
        default: false
        type: boolean

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The mutation step diffs the tree against the commit the push or
          # the pull request started from.
          fetch-depth: 0

      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Restore build artifacts
        id: artifacts
        uses: actions/cache/restore@v4
        with:
          path: .artifacts
          # Every run saves under its own run_id, so the fallbacks are
          # what actually restores: this branch's most recent run first,
          # then any branch's on the same lockfile (main, in practice),
          # then any lockfile's. A repo that writes nothing under
          # .artifacts simply misses, and a stale restore on such a repo
          # is inert: no target reads it.
          key: artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}
          restore-keys: |
            artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}-
            artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-
            artifacts-${{ runner.os }}-

      - name: Build
        run: make build

      - name: Resolve Playwright version
        if: inputs.browsers
        id: playwright
        # A caller's toolchain decides which lockfile exists — try each in
        # turn rather than assuming npm, so bun and pnpm repos cache the
        # right browser build instead of silently skipping the cache.
        run: |
          version=""
          if [ -f package-lock.json ]; then
            version=$(node -p "require('./package-lock.json').packages['node_modules/playwright']?.version || ''")
          fi
          if [ -z "$version" ] && [ -f bun.lock ]; then
            version=$(grep -oE '"playwright@[^"]+"' bun.lock | head -1 | sed -E 's/"playwright@([^"]+)"/\1/')
          fi
          if [ -z "$version" ] && [ -f pnpm-lock.yaml ]; then
            version=$(grep -oE '/?playwright@[0-9][^:[:space:]]*' pnpm-lock.yaml | head -1 | sed -E 's#.*playwright@##')
          fi
          if [ -z "$version" ]; then
            echo "::error::browsers: true but no lockfile (package-lock.json, bun.lock, pnpm-lock.yaml) names a playwright version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: inputs.browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        if: inputs.browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Mutation
        # Only a Makefile with a `mutation` target runs it; the restored
        # .artifacts/ carries Stryker's incremental file, so a run measures
        # only the mutants whose source or tests changed. The whole suite
        # measures the lines this push or pull request changed, since the
        # commit named here.
        env:
          TYPESCRIPT_MUTATION_SINCE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if grep -q '^mutation:' Makefile; then
            make mutation
          fi

      - name: Save build artifacts
        # always(): a red run still compiled and still wrote a tsc
        # buildinfo, and the retry that follows is exactly when the warm
        # tree is worth most. No cache-hit guard is needed — the run_id
        # below makes this key new on every run, so it is never a hit.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .artifacts
          # The restore step's own key, so install steps that touch a
          # lockfile between the two cannot shift the hash under us —
          # plus the run_id, because a cache key is immutable once
          # written and a buildinfo changes with every commit. One entry
          # per run keeps the cache tracking HEAD; the restore's first
          # fallback picks the newest.
          key: ${{ steps.artifacts.outputs.cache-primary-key }}-${{ github.run_id }}

  mobile-scope:
    name: Mobile scope
    # Who opts in and which changes run it: docs/01-architecture.md#the-mobile-job.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decide
        id: scope
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          config=jterrazz.config.ts
          run=false
          if [ -f "$config" ]; then
            if grep -Eq "kind:[[:space:]]*['\"]mobile['\"]" "$config"; then
              declared=app
            elif grep -Eq "facet:[[:space:]]*['\"]mobile['\"]" "$config"; then
              declared=facet
            else
              declared=
            fi
            since="${BASE:-$BEFORE}"
            if [ -n "$declared" ]; then
              if ! grep -q '^test-mobile:' Makefile; then
                echo "::error::$config declares mobile, and the Makefile names no test-mobile target to run its specs on a simulator" >&2
                exit 1
              fi
              if [ -z "$since" ] || ! git cat-file -e "$since" 2>/dev/null; then
                run=true
              elif [ "$declared" = app ]; then
                git diff --quiet "$since" HEAD || run=true
              elif git diff --name-only "$since" HEAD | grep -Eq '(^|/)(mobile|ios)([/.-]|$)|-mobile(/|$)'; then
                run=true
              fi
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  mobile:
    name: Mobile
    needs: mobile-scope
    if: needs.mobile-scope.outputs.run == 'true'
    # Xcode and the iOS simulators live on the macOS image alone.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: inputs.node-version != ''
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Test on a simulator
        run: make test-mobile

