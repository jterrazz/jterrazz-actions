name: Release Go

on:
  workflow_call:
    inputs:
      binary-name:
        description: Name of the output binary
        required: true
        type: string
      build-path:
        description: Path to the Go main package
        default: "."
        type: string
      go-version:
        description: Go version to use
        default: "1.24"
        type: string
      targets:
        description: Comma-separated GOOS/GOARCH pairs to build
        default: "darwin/arm64,darwin/amd64,linux/arm64,linux/amd64"
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      # This job runs the three gates itself rather than calling
      # validate.yaml, so it carries its own copy of that workflow's
      # .artifacts cache. Read the rationale there.
      - name: Restore build artifacts
        id: artifacts
        uses: actions/cache/restore@v4
        with:
          path: .artifacts
          key: artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}
          restore-keys: |
            artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}-
            artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-
            artifacts-${{ runner.os }}-

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Save build artifacts
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .artifacts
          key: ${{ steps.artifacts.outputs.cache-primary-key }}-${{ github.run_id }}

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ inputs.go-version }}

      - name: Build binaries
        run: |
          IFS=',' read -ra PAIRS <<< "${{ inputs.targets }}"
          for pair in "${PAIRS[@]}"; do
            os="${pair%/*}"
            arch="${pair#*/}"
            output="${{ inputs.binary-name }}-${os}-${arch}"
            echo "Building ${output}..."
            GOOS="${os}" GOARCH="${arch}" go build -o "dist/${output}" ${{ inputs.build-path }}
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
