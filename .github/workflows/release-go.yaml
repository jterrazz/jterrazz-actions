name: Release Go

on:
  workflow_call:
    inputs:
      binary-name:
        description: Name of the output binary
        required: true
        type: string
      build-path:
        description: Path to the Go main package
        default: "."
        type: string
      go-version:
        description: Go version to use
        default: "1.24"
        type: string
      targets:
        description: Comma-separated GOOS/GOARCH pairs to build
        default: "darwin/arm64,darwin/amd64,linux/arm64,linux/amd64"
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Restore build artifacts
        id: artifacts
        uses: jterrazz/jterrazz-actions/actions/artifacts-cache@main
        with:
          phase: restore

      - name: Build
        run: make build

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      - name: Save build artifacts
        if: always()
        uses: jterrazz/jterrazz-actions/actions/artifacts-cache@main
        with:
          phase: save
          key: ${{ steps.artifacts.outputs.key }}

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}

      - name: Build binaries
        run: |
          IFS=',' read -ra PAIRS <<< "${{ inputs.targets }}"
          for pair in "${PAIRS[@]}"; do
            os="${pair%/*}"
            arch="${pair#*/}"
            output="${{ inputs.binary-name }}-${os}-${arch}"
            echo "Building ${output}..."
            GOOS="${os}" GOARCH="${arch}" go build -o "dist/${output}" ${{ inputs.build-path }}
          done

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: dist/*
