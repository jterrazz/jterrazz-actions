name: Release npm

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version to install
        default: "24"
        type: string
      browsers:
        description: Provision Playwright browsers before testing (forwarded to validate.yaml)
        default: false
        type: boolean

jobs:
  validate:
    name: Validate
    uses: jterrazz/jterrazz-actions/.github/workflows/validate.yaml@main
    with:
      node-version: ${{ inputs.node-version }}
      browsers: ${{ inputs.browsers }}
      mutation: false

  publish:
    name: Publish
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install and build
        run: make build

      - name: Publish to npm
        # value: a publish takes seconds; when the registry degrades, npm holds
        # the PUT open for 11-14 minutes before it fails, so the bound fails
        # it early and leaves the rerun to whoever reads the outage.
        timeout-minutes: 4
        run: npm publish --access public --provenance
