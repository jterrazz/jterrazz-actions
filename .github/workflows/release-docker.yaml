name: Release Docker

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name (without registry prefix)
        required: true
        type: string
      node-version:
        description: Node.js version for validation (leave empty to skip)
        default: ""
        type: string
      timeout:
        description: Helm deploy timeout
        default: "3m"
        type: string
      manifest:
        description: Path to the Helm values manifest
        default: ".infrastructure/application.yaml"
        type: string
      dockerfile:
        description: Path to Dockerfile
        default: "Dockerfile"
        type: string
      build-args:
        description: Docker build arguments
        default: ""
        type: string
      keep-latest-versions:
        description: Number of recent v* tags to keep in registry
        default: "3"
        type: string
    secrets:
      INFISICAL_CLIENT_ID:
        required: true
      INFISICAL_CLIENT_SECRET:
        required: true

env:
  REGISTRY: registry.jterrazz.com

jobs:
  validate:
    name: Validate
    uses: jterrazz/jterrazz-workflows/.github/workflows/validate.yaml@main
    with:
      node-version: ${{ inputs.node-version }}

  release:
    name: Release
    needs: validate
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to infrastructure
        uses: jterrazz/jterrazz-workflows/actions/infra-connect@main
        with:
          infisical-client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          infisical-client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}

      - name: Determine image tag
        id: image
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "trigger=tag" >> $GITHUB_OUTPUT
          else
            echo "tag=latest" >> $GITHUB_OUTPUT
            echo "trigger=main" >> $GITHUB_OUTPUT
          fi

      - name: Build and push image
        uses: jterrazz/jterrazz-workflows/actions/docker-build@main
        with:
          image-name: ${{ inputs.image-name }}
          tag: ${{ steps.image.outputs.tag }}
          dockerfile: ${{ inputs.dockerfile }}
          build-args: ${{ inputs.build-args }}

      - name: Resolve deployments
        id: deployments
        run: |
          MANIFEST="${{ inputs.manifest }}"
          TRIGGER="${{ steps.image.outputs.trigger }}"
          IMAGE_TAG="${{ steps.image.outputs.tag }}"
          EVENT="${{ github.event_name }}"

          ENVS_JSON=$(yq -o json '.environments' "$MANIFEST" 2>/dev/null || echo "{}")
          HAS_TAGS=$(echo "$ENVS_JSON" | jq '[to_entries[].value.tag // empty] | length')

          if [ "$HAS_TAGS" = "0" ]; then
            if [ "$TRIGGER" = "tag" ]; then
              echo 'list=[{"env":"prod","image_tag":"'"$IMAGE_TAG"'"}]' >> $GITHUB_OUTPUT
            else
              echo 'list=[{"env":"staging","image_tag":"latest"}]' >> $GITHUB_OUTPUT
            fi
          else
            if [ "$TRIGGER" = "tag" ]; then
              DEPLOYMENTS=$(echo "$ENVS_JSON" | jq -c --arg t "$IMAGE_TAG" \
                '[to_entries[] | select(.value.tag == "next") | {"env": .key, "image_tag": $t}]')
            else
              DEPLOYMENTS=$(echo "$ENVS_JSON" | jq -c \
                '[to_entries[] | select(.value.tag == "main") | {"env": .key, "image_tag": "latest"}]')

              if [ "$EVENT" = "workflow_dispatch" ]; then
                PINNED=$(echo "$ENVS_JSON" | jq -c \
                  '[to_entries[] | select(.value.tag != "main" and .value.tag != "next") | {"env": .key, "image_tag": .value.tag}]')
                DEPLOYMENTS=$(echo "$DEPLOYMENTS $PINNED" | jq -c -s 'add')
              fi
            fi

            echo "list=$DEPLOYMENTS" >> $GITHUB_OUTPUT
          fi

      - name: Deploy
        uses: jterrazz/jterrazz-workflows/actions/docker-deploy@main
        with:
          image-name: ${{ inputs.image-name }}
          deployments: ${{ steps.deployments.outputs.list }}
          manifest: ${{ inputs.manifest }}
          timeout: ${{ inputs.timeout }}

      - name: Cleanup old images
        uses: jterrazz/jterrazz-workflows/actions/docker-cleanup@main
        with:
          image-name: ${{ inputs.image-name }}
          keep-latest-versions: ${{ inputs.keep-latest-versions }}
