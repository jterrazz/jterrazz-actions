name: Release Docker

on:
  workflow_call:
    inputs:
      image-name:
        description: Image name (without registry prefix)
        required: true
        type: string
      node-version:
        description: Node.js version for validation (leave empty to skip)
        default: ""
        type: string
      browsers:
        description: Provision Playwright browsers before testing (forwarded to validate.yaml)
        default: false
        type: boolean
      mutation:
        description: Run the Makefile's `mutation` target after Test (forwarded to validate.yaml)
        default: false
        type: boolean
      timeout:
        description: Helm deploy timeout
        # value: matches docker-deploy's own default; see that action.yaml for
        # the cert-manager headroom rationale (5m covers ACME issuance
        # when multiple apps roll new Certificates simultaneously).
        default: "5m"
        type: string
      manifest:
        description: Path to the Helm values manifest
        default: ".infrastructure/application.yaml"
        type: string
      dockerfile:
        description: Path to Dockerfile
        default: "Dockerfile"
        type: string

env:
  REGISTRY: registry.internal.jterrazz.com

jobs:
  validate:
    name: Validate
    uses: jterrazz/studio-actions/.github/workflows/validate.yaml@main
    with:
      node-version: ${{ inputs.node-version }}
      browsers: ${{ inputs.browsers }}
      # value: a schedule rebuilds a commit its push already gated, mutation included, and with
      # no commit to diff from its mutation would measure everything, cold; it only re-proves
      # build, lint and test before the base image moves.
      mutation: ${{ inputs.mutation && github.event_name != 'schedule' }}

  release:
    name: Release
    needs: validate
    # invariant: the images are linux/arm64 (the node is Apple silicon), built natively; GitHub has
    # no -latest label for Arm, so this names the newest Arm image.
    runs-on: ubuntu-26.04-arm
    # invariant: id-token is how docker-deploy authenticates to the cluster (GitHub
    # OIDC, no stored kubeconfig). A reusable workflow can only narrow what its
    # caller grants, so every calling job must grant `id-token: write` too.
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Connect to infrastructure
        uses: jterrazz/studio-actions/actions/infra-connect@main

      # invariant: a `v*` tag is a release, built and pushed as `:<tag>`; anything else (a push to main,
      # the weekly schedule, a dispatch on main) is a push, built as `:latest`. Either way docker-deploy
      # resolves the tag just pushed to its digest and deploys that.
      - name: Determine image tag
        id: image
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF" == refs/tags/v* ]]; then
            echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
            echo "trigger=release" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "trigger=push" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push image
        uses: jterrazz/studio-actions/actions/docker-build@main
        with:
          image-name: ${{ inputs.image-name }}
          tag: ${{ steps.image.outputs.tag }}
          dockerfile: ${{ inputs.dockerfile }}

      - name: Resolve deployments
        id: deployments
        env:
          MANIFEST: ${{ inputs.manifest }}
          TRIGGER: ${{ steps.image.outputs.trigger }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        # invariant: `deploy` names what deploys an environment: `push` every push to main, `release`
        # a `v*` tag, with the image built for that tag. A schedule (the weekly rebuild that takes the
        # base image's patches) runs on the default branch's HEAD, so it is a push here: it rebuilds
        # `latest` and deploys the `push` environments, never a `release` one. A shared app
        # (`scope: shared`) carries one root `deploy` and deploys as the one environment `shared`
        # (studio-infrastructure ADR-029).
        # hazard: an environment naming neither value fails the run, before anything deploys: a
        # default would deploy where nobody asked, or leave an environment silently stale.
        run: |
          set -euo pipefail
          SCOPE=$(yq '.scope // ""' "$MANIFEST")
          if [ "$SCOPE" = "shared" ]; then
            ENVS_JSON=$(yq -o json '{"shared": {"deploy": .deploy}}' "$MANIFEST")
          else
            ENVS_JSON=$(yq -o json '.environments // {}' "$MANIFEST")
          fi
          UNNAMED=$(echo "$ENVS_JSON" | jq -r \
            '[to_entries[] | select(.value.deploy != "push" and .value.deploy != "release") | .key] | join(", ")')
          if [ -n "$UNNAMED" ]; then
            echo "::error file=$MANIFEST::$UNNAMED: each environment names \`deploy: push\` or \`deploy: release\`"
            exit 1
          fi
          DEPLOYMENTS=$(echo "$ENVS_JSON" | jq -c --arg when "$TRIGGER" --arg tag "$IMAGE_TAG" \
            '[to_entries[] | select(.value.deploy == $when) | {"env": .key, "image_tag": $tag}]')
          echo "list=$DEPLOYMENTS" >> "$GITHUB_OUTPUT"

      - name: Deploy
        uses: jterrazz/studio-actions/actions/docker-deploy@main
        with:
          image-name: ${{ inputs.image-name }}
          deployments: ${{ steps.deployments.outputs.list }}
          manifest: ${{ inputs.manifest }}
          timeout: ${{ inputs.timeout }}

      - name: Cleanup old images
        uses: jterrazz/studio-actions/actions/docker-cleanup@main
        with:
          image-name: ${{ inputs.image-name }}
