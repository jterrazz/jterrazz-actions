name: Docs

on:
    workflow_call:
        inputs:
            node-version:
                description: Node.js version to install
                default: '24'
                type: string

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ inputs.node-version }}
                  cache: npm

            - name: Install
              run: npm ci

            - name: Generate docs
              run: make docs

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: .docs

    deploy:
        name: Deploy
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
