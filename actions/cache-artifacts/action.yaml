name: Cache build artifacts
description: Restore .artifacts before the gates, or save it after them under a key new to this run

inputs:
  phase:
    description: "`restore` before the gates, `save` after them"
    required: true
  path:
    description: The paths to cache, one per line
    default: ".artifacts"
  key:
    description: The key the restore phase output, for the save phase (empty saves nothing, with a notice)
    default: ""

outputs:
  key:
    description: The restore phase's primary key, for the save phase
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Check the phase
      id: phase
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
        KEY: ${{ inputs.key }}
      run: |
        case "$PHASE" in
          restore) ;;
          save)
            # value: a save runs `if: always()`, and an empty key means the restore never ran,
            # because a step before it failed: there is nothing to save, and a second red error
            # would only bury the first one.
            if [ -z "$KEY" ]; then
              echo "::notice::nothing to save: the restore phase did not run"
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
            ;;
          *)
            echo "::error::phase is restore or save, not '$PHASE'" >&2
            exit 1
            ;;
        esac

    - name: Restore
      if: inputs.phase == 'restore'
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        # invariant: every run saves under its own run_id, so the fallbacks are
        # what actually restores: this branch's most recent run first, then
        # any branch's on the same lockfile (main, in practice). Never another
        # lockfile's: tool state built against other dependencies is not
        # inert (Vite's optimised deps, restored across a lockfile change,
        # re-optimise mid-run and fail browser tests), so a new lockfile
        # starts cold, once.
        key: artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}
        restore-keys: |
          artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}-
          artifacts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-

    - name: Save
      if: inputs.phase == 'save' && steps.phase.outputs.skip != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ inputs.path }}
        # invariant: the restore phase's own key, so install steps that touch a
        # lockfile between the two cannot shift the hash, plus the run_id,
        # because a cache key is immutable once written and a buildinfo
        # changes with every commit. One entry per run keeps the cache
        # tracking HEAD; the restore's first fallback picks the newest. No
        # cache-hit guard is needed: the run_id makes the key new every run.
        key: ${{ inputs.key }}-${{ github.run_id }}
