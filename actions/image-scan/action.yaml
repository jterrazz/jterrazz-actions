name: Scan image
description: Fail the release on a critical vulnerability the image could already be rid of

inputs:
  image:
    description: Full image reference to scan (registry/name:tag), as docker-build pushed it
    required: true
  enforce:
    description: Fail the release on a finding ("true"), or report it as a warning alone ("false")
    # hazard: report-only until the production images stop shipping the lint and test toolchains
    # (ls-lint and oxlint's Go binaries carry the criticals found on 2026-10-28); flip it then.
    default: "false"
  ignore-file:
    description: The repository's exceptions, each with a statement and an expiry (Trivy's .trivyignore.yaml)
    default: ".trivyignore.yaml"

runs:
  using: composite
  steps:
    # invariant: the binary, not aquasecurity/trivy-action: that action's tags were rewritten in
    # March 2026, and a binary pinned by version and checksum cannot move under us. The version is
    # weeks old on purpose, the same quarantine the Renovate preset gives every other dependency.
    - name: Install Trivy
      shell: bash
      env:
        VERSION: "0.75.0"
        SHA256: "a1ee9f6ffb7d112b64ff726a2a0717c21175c1114361391f4a132956751a13b3"
      run: |
        set -euo pipefail
        archive="trivy_${VERSION}_Linux-ARM64.tar.gz"
        curl -fsSL -o "$RUNNER_TEMP/$archive" \
          "https://github.com/aquasecurity/trivy/releases/download/v${VERSION}/${archive}"
        echo "${SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --quiet
        tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
        echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

    # value: the vulnerability database is ~60 MB and refreshed several times a day; one cache
    # entry per day keeps every scan of that day off the download.
    - name: Date the database
      id: day
      shell: bash
      run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Restore the vulnerability database
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/trivy
        key: trivy-db-${{ runner.arch }}-${{ steps.day.outputs.day }}
        restore-keys: trivy-db-${{ runner.arch }}-

    # invariant: the gate is CRITICAL with a published fix. A fixable critical fails the release
    # before anything deploys; one without a fix is reported, never blocking, since no rebuild can
    # clear it. HIGH and below are reported for the reader alone.
    # outside: the image is read from the registry with the credentials infra-connect exported,
    # passed as environment, never as arguments.
    - name: Scan
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        IGNORE_FILE: ${{ inputs.ignore-file }}
        ENFORCE: ${{ inputs.enforce }}
        TRIVY_USERNAME: ${{ env.DOCKER_REGISTRY_USERNAME }}
        TRIVY_PASSWORD: ${{ env.DOCKER_REGISTRY_PASSWORD }}
        TRIVY_NO_PROGRESS: "true"
        TRIVY_SCANNERS: vuln
      run: |
        set -euo pipefail
        ignore=()
        if [ -f "$IGNORE_FILE" ]; then ignore=(--ignorefile "$IGNORE_FILE"); fi

        trivy image --quiet "${ignore[@]}" --severity CRITICAL,HIGH \
          --format table --output "$RUNNER_TEMP/report.txt" "$IMAGE"
        {
          echo "### Vulnerabilities in \`$IMAGE\` (critical and high)"
          echo '```'
          cat "$RUNNER_TEMP/report.txt"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

        trivy image --quiet --skip-db-update "${ignore[@]}" --severity CRITICAL --ignore-unfixed \
          --exit-code 1 --format table "$IMAGE" || {
          message="$IMAGE carries a critical vulnerability with a published fix: rebuild or bump what carries it, or record an exception in $IGNORE_FILE"
          if [ "$ENFORCE" = "true" ]; then
            echo "::error::$message"
            exit 1
          fi
          echo "::warning::$message (reported, not enforced)"
        }
