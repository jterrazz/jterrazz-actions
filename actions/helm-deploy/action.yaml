name: Helm Deploy
description: Deploy an application to the Kubernetes cluster via the app Helm chart

inputs:
  registry:
    description: Container registry hostname
    default: 'registry.jterrazz.com'
  image-name:
    description: Image name (without registry prefix)
    required: true
  tag:
    description: Image tag to deploy (legacy single-deploy mode)
    default: ''
  environment:
    description: Deployment environment (legacy single-deploy mode)
    default: ''
  deployments:
    description: 'JSON array of {"env","image_tag"} objects. Overrides tag/environment inputs.'
    default: ''
  manifest:
    description: Path to the Helm values manifest
    default: '.infrastructure/application.yaml'
  timeout:
    description: Helm deploy timeout
    default: '3m'
  public-ip:
    description: Server public IP for DNS records
    default: '46.224.186.190'
  tailscale-hostname:
    description: Tailscale hostname for private DNS records
    default: 'jterrazz-vps.tail77a797.ts.net'

runs:
  using: composite
  steps:
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: 'v3.17.3'

    - name: Setup kubeconfig
      shell: bash
      run: |
        mkdir -p ~/.kube
        echo "${{ env.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Login to OCI registry
      shell: bash
      run: |
        echo "${{ env.DOCKER_REGISTRY_PASSWORD }}" | helm registry login ${{ inputs.registry }} \
          --username ${{ env.DOCKER_REGISTRY_USERNAME }} --password-stdin

    - name: Build dashboard set-file args
      id: dashboards
      shell: bash
      run: |
        DASHBOARD_ARGS=""
        DASHBOARD_DIR="$(dirname ${{ inputs.manifest }})/dashboards"
        if [ -d "$DASHBOARD_DIR" ]; then
          for f in "$DASHBOARD_DIR"/*.json; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .json)
            DASHBOARD_ARGS="$DASHBOARD_ARGS --set-file spec.dashboards.$name=$f"
          done
        fi
        echo "args=$DASHBOARD_ARGS" >> "$GITHUB_OUTPUT"

    - name: Deploy via Helm
      shell: bash
      run: |
        DEPLOYMENTS='${{ inputs.deployments }}'

        # Fallback to legacy single-deploy inputs
        if [ -z "$DEPLOYMENTS" ] || [ "$DEPLOYMENTS" = "[]" ]; then
          ENV="${{ inputs.environment }}"
          TAG="${{ inputs.tag }}"
          if [ -z "$ENV" ] || [ -z "$TAG" ]; then
            echo "Error: either 'deployments' or both 'environment' and 'tag' must be provided"
            exit 1
          fi
          DEPLOYMENTS='[{"env":"'"$ENV"'","image_tag":"'"$TAG"'"}]'
        fi

        echo "$DEPLOYMENTS" | jq -r '.[] | "\(.env)|\(.image_tag)"' | while IFS='|' read -r ENV TAG; do
          echo "::group::Deploying $ENV with image tag $TAG"
          helm upgrade --install ${ENV}-${{ inputs.image-name }} \
            oci://${{ inputs.registry }}/charts/app \
            -f ${{ inputs.manifest }} \
            --set environment=${ENV} \
            --set spec.image=${{ inputs.registry }}/${{ inputs.image-name }}:${TAG} \
            --set registry.username=${{ env.DOCKER_REGISTRY_USERNAME }} \
            --set registry.password=${{ env.DOCKER_REGISTRY_PASSWORD }} \
            --set infrastructure.publicIp=${{ inputs.public-ip }} \
            --set infrastructure.tailscaleHostname=${{ inputs.tailscale-hostname }} \
            ${{ steps.dashboards.outputs.args }} \
            -n ${ENV}-${{ inputs.image-name }} \
            --create-namespace \
            --wait --timeout ${{ inputs.timeout }} --atomic
          echo "::endgroup::"
        done
