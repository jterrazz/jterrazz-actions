name: Cache build artifacts
description: Restore .artifacts before the gates, or save it after them under a key new to this run

inputs:
  phase:
    description: "`restore` before the gates, `save` after them"
    required: true
  path:
    description: The paths to cache, one per line
    default: ".artifacts"
  key:
    description: The key the restore phase output, required by the save phase
    default: ""

outputs:
  key:
    description: The restore phase's primary key, for the save phase
    value: ${{ steps.restore.outputs.cache-primary-key }}

runs:
  using: composite
  steps:
    - name: Check the phase
      shell: bash
      env:
        PHASE: ${{ inputs.phase }}
        KEY: ${{ inputs.key }}
      run: |
        case "$PHASE" in
          restore) ;;
          save)
            if [ -z "$KEY" ]; then
              echo "::error::phase save needs the key the restore phase output" >&2
              exit 1
            fi
            ;;
          *)
            echo "::error::phase is restore or save, not '$PHASE'" >&2
            exit 1
            ;;
        esac

    - name: Restore
      if: inputs.phase == 'restore'
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ${{ inputs.path }}
        # invariant: every run saves under its own run_id, so the fallbacks are
        # what actually restores: this branch's most recent run first, then
        # any branch's on the same lockfile (main, in practice), then any
        # lockfile's. A repo that writes nothing under .artifacts simply
        # misses, and a stale restore on such a repo is inert: no target
        # reads it.
        key: artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}
        restore-keys: |
          artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-${{ github.ref_name }}-
          artifacts-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/bun.lock', '**/pnpm-lock.yaml', '**/go.sum', '**/Cargo.lock') }}-
          artifacts-${{ runner.os }}-

    - name: Save
      if: inputs.phase == 'save'
      uses: actions/cache/save@v4
      with:
        path: ${{ inputs.path }}
        # invariant: the restore phase's own key, so install steps that touch a
        # lockfile between the two cannot shift the hash, plus the run_id,
        # because a cache key is immutable once written and a buildinfo
        # changes with every commit. One entry per run keeps the cache
        # tracking HEAD; the restore's first fallback picks the newest. No
        # cache-hit guard is needed: the run_id makes the key new every run.
        key: ${{ inputs.key }}-${{ github.run_id }}
