name: Write summary
description: Gather every job's report and write the run's one Markdown summary

inputs:
  needs:
    description: The calling job's `needs` context, as JSON (each job's result)
    required: true
  image-name:
    description: Image name, for a run that planned nothing
    default: ""

runs:
  using: composite
  steps:
    - name: Gather the reports
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        path: ${{ runner.temp }}/studio-report
        merge-multiple: true

    - name: Render
      shell: bash
      env:
        REPORT_DIR: ${{ runner.temp }}/studio-report
        NEEDS: ${{ inputs.needs }}
        IMAGE: ${{ inputs.image-name }}
        EVENT: ${{ github.event_name }}
        SHA: ${{ github.sha }}
        ACTOR: ${{ github.triggering_actor }}
        COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
      run: |
        mkdir -p "$REPORT_DIR"
        node "$GITHUB_ACTION_PATH/../../scripts/summary.mjs"
