name: Deploy via Helm
description: Deploy an application to the K3s cluster using the shared Helm chart

inputs:
  registry:
    description: Container registry hostname
    default: "registry.internal.jterrazz.com"
  image-name:
    description: Image name (without registry prefix)
    required: true
  deployments:
    description: JSON array of {"env","image_tag"} objects
    required: true
  manifest:
    description: Path to the Helm values manifest
    default: ".infrastructure/application.yaml"
  timeout:
    description: Helm deploy timeout
    # 5m gives cert-manager headroom on the first deploy that introduces
    # a new Certificate (DNS-01 against Cloudflare typically takes ~60s
    # but can queue when several apps roll out simultaneously). Steady-
    # state upgrades that don't rename a cert finish in seconds, so the
    # higher default costs nothing.
    default: "5m"

runs:
  using: composite
  steps:
    - name: Setup Helm
      uses: azure/setup-helm@v4
      with:
        version: "v3.17.3"

    - name: Setup kubeconfig
      shell: bash
      run: |
        mkdir -p ~/.kube
        echo "${{ env.KUBECONFIG_BASE64 }}" | base64 -d > ~/.kube/config
        chmod 600 ~/.kube/config

    - name: Login to OCI registry
      shell: bash
      run: |
        echo "${{ env.DOCKER_REGISTRY_PASSWORD }}" | helm registry login ${{ inputs.registry }} \
          --username ${{ env.DOCKER_REGISTRY_USERNAME }} --password-stdin

    - name: Build dashboard args
      id: dashboards
      shell: bash
      run: |
        DASHBOARD_ARGS=""
        DASHBOARD_DIR="$(dirname ${{ inputs.manifest }})/dashboards"
        if [ -d "$DASHBOARD_DIR" ]; then
          for f in "$DASHBOARD_DIR"/*.json; do
            [ -f "$f" ] || continue
            name=$(basename "$f" .json)
            DASHBOARD_ARGS="$DASHBOARD_ARGS --set-file spec.dashboards.$name=$f"
          done
        fi
        echo "args=$DASHBOARD_ARGS" >> "$GITHUB_OUTPUT"

    # `github.repository` is the CALLING repo even through the reusable
    # workflow, which is the point: the app chart stamps it on the Deployment as
    # `app.jterrazz.com/repository`, and that annotation is the only place the
    # cluster records which repo rebuilds a workload. jterrazz-infrastructure's
    # `make redeploy-apps` reads it off the live Deployments instead of holding
    # a list of repos that goes stale — so an app that stops passing this drops
    # out of the fleet rebuild.
    #
    # The chart is handed NO credential. `registry-credentials` — the pull
    # secret every pod on our registry mounts — is synced into the namespace by
    # the Infisical operator from /jterrazz-actions, the same path this job read
    # its own login from a few steps above. Passing it as a value again would
    # put the password back on this runner's argv and into every release Secret
    # Helm keeps; app chart 2.12.0 dropped `registry.username`/`registry.password`
    # for exactly that reason.
    - name: Deploy
      shell: bash
      run: |
        echo '${{ inputs.deployments }}' | jq -r '.[] | "\(.env)|\(.image_tag)"' | while IFS='|' read -r ENV TAG; do
          echo "::group::Deploying $ENV with image tag $TAG"
          helm upgrade --install ${ENV}-${{ inputs.image-name }} \
            oci://${{ inputs.registry }}/charts/app \
            -f ${{ inputs.manifest }} \
            --set environment=${ENV} \
            --set spec.image=${{ inputs.registry }}/${{ inputs.image-name }}:${TAG} \
            --set meta.repository=${{ github.repository }} \
            ${{ steps.dashboards.outputs.args }} \
            -n ${ENV}-${{ inputs.image-name }} \
            --create-namespace \
            --wait --timeout ${{ inputs.timeout }} --atomic
          echo "::endgroup::"
        done
