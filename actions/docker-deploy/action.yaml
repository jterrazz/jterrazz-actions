name: Deploy via Helm
description: Deploy an application to the K3s cluster using the shared Helm chart

inputs:
  registry:
    description: Container registry hostname
    default: "registry.internal.jterrazz.com"
  image-name:
    description: Image name (without registry prefix)
    required: true
  deployments:
    description: JSON array of {"env","image_tag"} objects; env `shared` is a shared app's one release
    required: true
  manifest:
    description: Path to the Helm values manifest
    default: ".infrastructure/application.yaml"
  api-server:
    description: The cluster's API server, reached over the tailnet
    default: "https://studio-infrastructure.tail77a797.ts.net:6443"
  audience:
    # invariant: hand-synced with `k3s_oidc_audience` in studio-infrastructure
    # (src/ansible/inventories/group_vars/all/k3s.yml): the apiserver accepts no other.
    description: Audience of the GitHub OIDC token presented to the API server
    default: "studio-infrastructure"
  timeout:
    description: Helm deploy timeout
    # value: 5m gives cert-manager headroom on the first deploy that introduces
    # a new Certificate (DNS-01 against Cloudflare typically takes ~60s
    # but can queue when several apps roll out simultaneously). Steady-
    # state upgrades that don't rename a cert finish in seconds, so the
    # higher default costs nothing.
    default: "5m"

runs:
  using: composite
  steps:
    - name: Setup Helm
      uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      with:
        version: "v4.3.1"

    # invariant: kubectl and helm act as the calling repository's GitHub OIDC identity.
    - name: Connect to the cluster
      uses: jterrazz/studio-actions/actions/cluster-connect@main
      with:
        api-server: ${{ inputs.api-server }}
        audience: ${{ inputs.audience }}

    - name: Login to OCI registry
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        # hazard: read from the environment, never interpolated into the script text by an expression.
        printf '%s' "$DOCKER_REGISTRY_PASSWORD" | helm registry login "$REGISTRY" \
          --username "$DOCKER_REGISTRY_USERNAME" --password-stdin

    # invariant: .infrastructure/dashboards/*.json and .infrastructure/alerts/*.yaml, the layout
    # studio-infrastructure itself ships its platform's in; each file is one entry, by its name.
    - name: Build dashboard and alert args
      id: files
      shell: bash
      env:
        MANIFEST: ${{ inputs.manifest }}
      run: |
        set -euo pipefail
        args=""
        dir="$(dirname "$MANIFEST")"
        for f in "$dir"/dashboards/*.json; do
          [ -f "$f" ] && args="$args --set-file spec.dashboards.$(basename "$f" .json)=$f"
        done
        for f in "$dir"/alerts/*.yaml; do
          [ -f "$f" ] && args="$args --set-file spec.alerts.$(basename "$f" .yaml)=$f"
        done
        echo "args=$args" >> "$GITHUB_OUTPUT"

    # invariant: `github.repository` is the CALLING repo even through the reusable
    # workflow, which is the point: the app chart stamps it on the Deployment as
    # `studio.jterrazz.com/repository`, and that annotation is the only place the
    # cluster records which repo rebuilds a workload. studio-infrastructure's
    # `make redeploy-apps` reads it off the live Deployments instead of holding
    # a list of repos that goes stale, so an app that stops passing this drops
    # out of the fleet rebuild.
    #
    # The chart is handed NO credential. `registry-credentials` (the pull
    # secret every pod on our registry mounts) is synced into the namespace by
    # the Infisical operator; app chart 2.12.0 dropped
    # `registry.username`/`registry.password` to keep it off argv.
    #
    # hazard: the namespace and its RoleBinding come BEFORE helm, and helm gets no
    # `--create-namespace`. The repo owns a namespace only through the
    # `studio.jterrazz.com/repository` label it sets when creating it, and works
    # inside it only through the RoleBinding it grants itself there; both are
    # enforced by studio-infrastructure's app-deployer-ownership policy.
    #
    # The image is deployed BY DIGEST, resolved from the tag just pushed: two
    # environments on `latest` then run what each was deployed with, and a
    # later push to the tag changes nothing until the next deploy.
    - name: Deploy
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
        IMAGE: ${{ inputs.image-name }}
        MANIFEST: ${{ inputs.manifest }}
        TIMEOUT: ${{ inputs.timeout }}
        DEPLOYMENTS: ${{ inputs.deployments }}
        FILE_ARGS: ${{ steps.files.outputs.args }}
      run: |
        set -euo pipefail
        repo_name="${GITHUB_REPOSITORY#*/}"
        # invariant: the image is named after the app, whose name the namespace, the Infisical
        # folder and the ownership policy's `studio.jterrazz.com/app` label all carry.
        app=$(yq '.metadata.name' "$MANIFEST")
        if [ "$app" != "$IMAGE" ]; then
          echo "::error::metadata.name ($app) differs from image-name ($IMAGE): the namespace, the secrets folder and the image must share the app's one name"
          exit 1
        fi
        echo "$DEPLOYMENTS" | jq -r '.[] | "\(.env)|\(.image_tag)"' | while IFS='|' read -r ENV TAG; do
          echo "::group::Deploying $ENV with image tag $TAG"
          # invariant: <app>-<env>, or <app> for a shared app (env `shared`): the one name of the
          # namespace, release, volume and data directory (studio-infrastructure ADR-023, ADR-029).
          # The labels say it too, and the ownership policy holds the name to them.
          if [ "$ENV" = "shared" ]; then
            ns="$IMAGE"
            scope_label="studio.jterrazz.com/scope: shared"
          else
            ns="${IMAGE}-${ENV}"
            scope_label="studio.jterrazz.com/environment: $ENV"
          fi
          digest=$(docker buildx imagetools inspect "$REGISTRY/$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r .digest)
          echo "image: $REGISTRY/$IMAGE@$digest"
          kubectl apply -f - <<EOF
        apiVersion: v1
        kind: Namespace
        metadata:
          name: $ns
          labels:
            studio.jterrazz.com/tier: app
            studio.jterrazz.com/app: $IMAGE
            $scope_label
            studio.jterrazz.com/repository: $repo_name
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: app-namespace-admin
          namespace: $ns
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: app-namespace-admin
        subjects:
          - apiGroup: rbac.authorization.k8s.io
            kind: User
            name: github:$GITHUB_REPOSITORY
        EOF
          # shellcheck disable=SC2086
          helm upgrade --install "$ns" \
            "oci://$REGISTRY/charts/app" \
            -f "$MANIFEST" \
            --set environment="$ENV" \
            --set spec.image="$REGISTRY/$IMAGE@$digest" \
            --set meta.repository="$GITHUB_REPOSITORY" \
            $FILE_ARGS \
            -n "$ns" \
            --history-max 3 \
            --wait --timeout "$TIMEOUT" --rollback-on-failure
          echo "::endgroup::"
        done
