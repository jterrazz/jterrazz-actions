name: Cleanup old images
description: Remove old registry tags and prune the node's unreferenced containerd content

inputs:
  registry:
    description: Container registry hostname
    default: "registry.internal.jterrazz.com"
  image-name:
    description: Image name to clean up
    required: true
  keep-latest-versions:
    description: Number of recent v* tags to keep
    default: "3"

runs:
  using: composite
  steps:
    - name: Delete old tags
      shell: bash
      run: |
        # A netrc file, never `-u user:password`: an argument is readable in
        # `ps` by anything else on the runner for as long as curl runs, and
        # this step runs curl once per tag. The values are read from the
        # environment infra-connect exported, so they are not interpolated
        # into this script's text either: the only copy is the 0600 file
        # below, and it dies with the step.
        NETRC=$(mktemp)
        trap 'rm -f "$NETRC"' EXIT
        chmod 600 "$NETRC"
        printf 'machine %s\nlogin %s\npassword %s\n' \
          "${{ inputs.registry }}" "$DOCKER_REGISTRY_USERNAME" "$DOCKER_REGISTRY_PASSWORD" > "$NETRC"

        ALL_TAGS=$(curl -s --netrc-file "$NETRC" \
          "https://${{ inputs.registry }}/v2/${{ inputs.image-name }}/tags/list" \
          | jq -r '.tags[]? // empty') || true

        if [ -z "$ALL_TAGS" ]; then
          echo "No tags found, skipping cleanup"
          exit 0
        fi

        KEEP_VTAGS=$(echo "$ALL_TAGS" | grep -E '^v[0-9]' | sort -V | tail -${{ inputs.keep-latest-versions }} || true)

        # Multi-Accept so the registry returns the digest of whatever
        # top-level manifest the tag actually points at. Asking only for
        # `manifest.v2+json` on a multi-arch tag makes the registry
        # content-negotiate down to one platform's child manifest; the
        # digest we get back is that child, not the index. Then DELETE on
        # that digest removes the child, leaving other tags that share it
        # orphaned and pruning their layers at GC time. Listing the OCI
        # index and Docker manifest-list types first means we always
        # delete the index when there is one.
        ACCEPT_HEADER='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

        for TAG in $ALL_TAGS; do
          [[ "$TAG" == "latest" ]] && continue
          echo "$KEEP_VTAGS" | grep -qx "$TAG" 2>/dev/null && continue

          DIGEST=$(curl -s -I --netrc-file "$NETRC" \
            -H "Accept: $ACCEPT_HEADER" \
            "https://${{ inputs.registry }}/v2/${{ inputs.image-name }}/manifests/$TAG" \
            | grep -i docker-content-digest | awk '{print $2}' | tr -d '\r' || true)

          if [ -n "$DIGEST" ]; then
            curl -s -X DELETE --netrc-file "$NETRC" \
              "https://${{ inputs.registry }}/v2/${{ inputs.image-name }}/manifests/$DIGEST" || true
            echo "Deleted: $TAG ($DIGEST)"
          fi
        done

    - name: Prune containerd images
      shell: bash
      # outside: k3s labels its one node `node-role.kubernetes.io/control-plane`, never
      # `master`; a selector on the old label leaves the pod unschedulable until
      # kubectl's one-minute timeout. A failed prune leaves the release
      # deployed, so it warns instead of failing the job.
      # The registry's own garbage collection is not here: it is
      # jterrazz-infrastructure's `registry-gc` CronJob, which skips itself
      # while an upload is in flight, a guard a run inside a release cannot
      # pass since its own push just wrote one.
      run: |
        if ! kubectl run "ctr-prune-$RANDOM" --rm -i --restart=Never --image=alpine:latest \
          --overrides='{
            "spec": {
              "hostPID": true,
              "nodeSelector": {"node-role.kubernetes.io/control-plane": "true"},
              "tolerations": [{"operator": "Exists"}],
              "containers": [{
                "name": "prune",
                "image": "alpine:latest",
                "command": ["nsenter", "-t", "1", "-m", "--", "k3s", "ctr", "content", "prune", "references"],
                "securityContext": {"privileged": true}
              }]
            }
          }'; then
          echo "::warning title=containerd prune failed::the node's unreferenced image content was not pruned; the release itself is deployed"
        fi
