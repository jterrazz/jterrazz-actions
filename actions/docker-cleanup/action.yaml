name: Cleanup old images
description: Remove old registry tags, run garbage collection, and prune containerd images

inputs:
  registry:
    description: Container registry hostname
    default: "registry.internal.jterrazz.com"
  image-name:
    description: Image name to clean up
    required: true
  keep-latest-versions:
    description: Number of recent v* tags to keep
    default: "3"

runs:
  using: composite
  steps:
    - name: Delete old tags
      shell: bash
      run: |
        ALL_TAGS=$(curl -s -u "${{ env.DOCKER_REGISTRY_USERNAME }}:${{ env.DOCKER_REGISTRY_PASSWORD }}" \
          "https://${{ inputs.registry }}/v2/${{ inputs.image-name }}/tags/list" \
          | jq -r '.tags[]? // empty') || true

        if [ -z "$ALL_TAGS" ]; then
          echo "No tags found, skipping cleanup"
          exit 0
        fi

        KEEP_VTAGS=$(echo "$ALL_TAGS" | grep -E '^v[0-9]' | sort -V | tail -${{ inputs.keep-latest-versions }} || true)

        # Multi-Accept so the registry returns the digest of whatever
        # top-level manifest the tag actually points at. Asking only for
        # `manifest.v2+json` on a multi-arch tag makes the registry
        # content-negotiate down to one platform's child manifest; the
        # digest we get back is that child, not the index. Then DELETE on
        # that digest removes the child, leaving other tags that share it
        # orphaned and pruning their layers at GC time. Listing the OCI
        # index and Docker manifest-list types first means we always
        # delete the index when there is one.
        ACCEPT_HEADER='application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.oci.image.manifest.v1+json,application/vnd.docker.distribution.manifest.v2+json'

        for TAG in $ALL_TAGS; do
          [[ "$TAG" == "latest" ]] && continue
          echo "$KEEP_VTAGS" | grep -qx "$TAG" 2>/dev/null && continue

          DIGEST=$(curl -s -I -u "${{ env.DOCKER_REGISTRY_USERNAME }}:${{ env.DOCKER_REGISTRY_PASSWORD }}" \
            -H "Accept: $ACCEPT_HEADER" \
            "https://${{ inputs.registry }}/v2/${{ inputs.image-name }}/manifests/$TAG" \
            | grep -i docker-content-digest | awk '{print $2}' | tr -d '\r' || true)

          if [ -n "$DIGEST" ]; then
            curl -s -X DELETE \
              -u "${{ env.DOCKER_REGISTRY_USERNAME }}:${{ env.DOCKER_REGISTRY_PASSWORD }}" \
              "https://${{ inputs.registry }}/v2/${{ inputs.image-name }}/manifests/$DIGEST" || true
            echo "Deleted: $TAG ($DIGEST)"
          fi
        done

    - name: Registry garbage collection
      shell: bash
      run: |
        kubectl exec -n platform-registry deploy/registry -- \
          bin/registry garbage-collect /etc/docker/registry/config.yml \
          2>&1 | tail -5 || true

    - name: Prune containerd images
      shell: bash
      run: |
        kubectl run ctr-prune-$RANDOM --rm -i --restart=Never --image=alpine:latest \
          --overrides='{
            "spec": {
              "hostPID": true,
              "nodeSelector": {"node-role.kubernetes.io/master": "true"},
              "tolerations": [{"operator": "Exists"}],
              "containers": [{
                "name": "prune",
                "image": "alpine:latest",
                "command": ["nsenter", "-t", "1", "-m", "--", "k3s", "ctr", "content", "prune", "references"],
                "securityContext": {"privileged": true}
              }]
            }
          }' 2>/dev/null || true
