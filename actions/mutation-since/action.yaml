name: Resolve the mutation range
description: The commit a push or a pull request started from, falling back to one the clone holds

inputs:
  working-directory:
    description: Directory of the repository's checkout
    default: "."

outputs:
  since:
    description: The commit to measure the change since, empty when the event carries none
    value: ${{ steps.since.outputs.since }}

runs:
  using: composite
  steps:
    - name: Resolve
      id: since
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # invariant: the toolchain refuses a commit the clone lacks, so a
      # force-push or a branch's first push (the zero commit) measures from
      # the fork point with the default branch, or the parent commit, named
      # in the log. A schedule or a dispatch carries no commit, so the range
      # stays empty and the working tree is measured against HEAD.
      env:
        BASE: ${{ github.event.pull_request.base.sha }}
        BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        since="${BASE:-$BEFORE}"
        if [ -n "$since" ] && ! git cat-file -e "$since^{commit}" 2>/dev/null; then
          fallback=$(git merge-base HEAD "origin/$DEFAULT_BRANCH" 2>/dev/null || true)
          if [ -z "$fallback" ] || [ "$fallback" = "$(git rev-parse HEAD)" ]; then
            fallback=$(git rev-parse --verify --quiet HEAD~1 || true)
          fi
          echo "The clone holds no commit $since: the change is measured since ${fallback:-HEAD}."
          since="$fallback"
        fi
        echo "since=$since" >> "$GITHUB_OUTPUT"
