name: Connect to infrastructure
description: With the job's GitHub OIDC token alone, read the registry account from Infisical, join the tailnet and log in to the registry

inputs:
  # invariant: the only secrets CI reads from Infisical are the registry account's,
  # held alone in the `studio-ci` project, which this OIDC identity can view
  # and nothing else (custom path-scoped roles are a paid Infisical feature).
  # Identifiers, not secrets: the identity trusts
  # repo:jterrazz@18480834/*:ref:refs/heads/main with audience
  # https://github.com/jterrazz.
  infisical-identity-id:
    description: Infisical machine identity (OIDC auth) that CI authenticates as
    default: "d9c2032f-2f4d-4ef4-85be-19df1bc70023"
  infisical-project-slug:
    description: Infisical project holding the registry account
    default: "studio-ci"
  registry:
    description: Container registry hostname
    default: "registry.internal.jterrazz.com"
  tailscale-client-id:
    description: Client ID of the Tailscale OIDC trust credential (not a secret)
    default: "TV53vwCkzz11CNTRL-kitEGnqFJB11CNTRL"
  tailscale-audience:
    description: Audience of the Tailscale OIDC trust credential (not a secret)
    default: "api.tailscale.com/TV53vwCkzz11CNTRL-kitEGnqFJB11CNTRL"

runs:
  using: composite
  steps:
    - name: Fetch secrets (GitHub OIDC)
      uses: Infisical/secrets-action@d2e351f16c6ca20d17c85e6c992e04bdeb64e87d # v1.0.18
      with:
        method: oidc
        identity-id: ${{ inputs.infisical-identity-id }}
        oidc-audience: https://github.com/jterrazz
        domain: https://eu.infisical.com
        project-slug: ${{ inputs.infisical-project-slug }}
        env-slug: prod
        secret-path: /

    # invariant: no Tailscale secret. The job's GitHub OIDC token is exchanged for a node
    # key through a Tailscale trust credential (workload identity federation)
    # that trusts `repo:jterrazz@18480834/*:ref:refs/heads/main` for tag:ci. The client
    # ID and audience are identifiers, not secrets. The calling job must grant
    # `id-token: write` (every deploying job already does).
    - name: Connect Tailscale
      uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf # v4.3.0
      with:
        oauth-client-id: ${{ inputs.tailscale-client-id }}
        audience: ${{ inputs.tailscale-audience }}
        tags: tag:ci

    # hazard: the registry's name is a public CNAME to the node's tailnet name
    # (<node>.<tailnet>.ts.net), and only MagicDNS answers that target. After
    # `tailscale up` the runner's resolver sometimes takes over a minute to chase
    # the chain, or never does (three failed deploys on 2026-10-24). So the chain
    # is resolved here, once and explicitly: the CNAME from public DNS, its
    # target from tailscaled itself, and the pair pinned in /etc/hosts. Nothing
    # is hardcoded: a repave that renames the node changes only the CNAME.
    - name: Resolve the registry over the tailnet
      shell: bash
      env:
        REGISTRY: ${{ inputs.registry }}
      run: |
        set -euo pipefail
        command -v dig >/dev/null || sudo apt-get install -y -qq dnsutils >/dev/null
        for _ in $(seq 1 30); do
          target=$(dig +short CNAME "$REGISTRY" @1.1.1.1 | sed 's/\.$//')
          ip=$( [ -n "$target" ] && tailscale ip -4 "$target" 2>/dev/null | head -1 || true)
          if [ -n "${ip:-}" ]; then
            echo "$ip $REGISTRY" | sudo tee -a /etc/hosts
            getent hosts "$REGISTRY"
            exit 0
          fi
          sleep 2
        done
        echo "::error::could not resolve $REGISTRY through its CNAME ($target) on the tailnet within 60 s"
        exit 1

    - name: Log in to registry
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ env.DOCKER_REGISTRY_USERNAME }}
        password: ${{ env.DOCKER_REGISTRY_PASSWORD }}
