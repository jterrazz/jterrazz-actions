name: Connect to infrastructure
description: Fetch secrets from Infisical, connect Tailscale VPN, and log in to container registry

inputs:
  infisical-client-id:
    description: Infisical client ID
    required: true
  infisical-client-secret:
    description: Infisical client secret
    required: true
  infisical-project-slug:
    description: Infisical project slug
    default: "jterrazz"
  infisical-secret-path:
    description: Infisical secret path
    default: "/infrastructure-apps"
  registry:
    description: Container registry hostname
    default: "registry.jterrazz.com"

runs:
  using: composite
  steps:
    - name: Fetch secrets
      uses: Infisical/secrets-action@v1.0.9
      with:
        method: universal
        client-id: ${{ inputs.infisical-client-id }}
        client-secret: ${{ inputs.infisical-client-secret }}
        domain: https://eu.infisical.com
        project-slug: ${{ inputs.infisical-project-slug }}
        env-slug: prod
        secret-path: ${{ inputs.infisical-secret-path }}

    - name: Connect Tailscale
      uses: tailscale/github-action@v3
      with:
        oauth-client-id: ${{ env.TAILSCALE_OAUTH_CLIENT_ID }}
        oauth-secret: ${{ env.TAILSCALE_OAUTH_CLIENT_SECRET }}
        tags: tag:ci

    - name: Log in to registry
      uses: docker/login-action@v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ env.DOCKER_REGISTRY_USERNAME }}
        password: ${{ env.DOCKER_REGISTRY_PASSWORD }}
