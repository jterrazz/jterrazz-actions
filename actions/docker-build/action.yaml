name: Build and push Docker image
description: Build a Docker image with Buildx and push to the container registry

inputs:
  registry:
    description: Container registry hostname
    default: "registry.jterrazz.com"
  image-name:
    description: Image name (without registry prefix)
    required: true
  tag:
    description: Image tag
    required: true
  context:
    description: Docker build context path
    default: "."
  dockerfile:
    description: Path to Dockerfile
    default: "Dockerfile"
  build-args:
    description: Docker build arguments
    default: ""

outputs:
  image:
    description: Full image reference (registry/name:tag)
    value: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.tag }}

runs:
  using: composite
  steps:
    - name: Setup Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        tags: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.tag }}
        build-args: ${{ inputs.build-args }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
