name: Build and push Docker image
description: Build a Docker image with Buildx and push to the container registry

inputs:
  registry:
    description: Container registry hostname
    default: "registry.internal.jterrazz.com"
  image-name:
    description: Image name (without registry prefix)
    required: true
  tag:
    description: Image tag
    required: true
  context:
    description: Docker build context path
    default: "."
  dockerfile:
    description: Path to Dockerfile
    default: "Dockerfile"
  build-args:
    description: Docker build arguments
    default: ""

outputs:
  image:
    description: Full image reference (registry/name:tag)
    value: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.tag }}

runs:
  using: composite
  steps:
    - name: Setup Buildx
      uses: docker/setup-buildx-action@v3
      # outside: network=host makes the buildkit container share the runner's
      # network namespace, including its Tailscale interface. Without
      # this, buildx uses Docker's default bridge with Azure DNS, which
      # cannot resolve registry.internal.jterrazz.com (the public CNAME points
      # into the private *.ts.net zone that only Tailscale's MagicDNS
      # knows). The push step then NXDOMAINs out.
      with:
        driver-opts: network=host

    - name: Build and push
      uses: docker/build-push-action@v6
      # value: no layer cache. Consecutive releases rarely share a lockfile, so the
      # dependency layer a cache would keep almost never hits, while exporting
      # it costs about a minute per release. No QEMU either: the runner is
      # arm64 like the image, so nothing is emulated.
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        push: true
        platforms: linux/arm64
        tags: ${{ inputs.registry }}/${{ inputs.image-name }}:${{ inputs.tag }}
        build-args: ${{ inputs.build-args }}
