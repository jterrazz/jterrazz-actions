name: Connect to the cluster
description: Point kubectl and helm at the cluster as the job's GitHub OIDC identity, through an exec plugin; no stored credential

inputs:
  api-server:
    description: The cluster's API server, reached over the tailnet
    default: "https://studio-infrastructure.tail77a797.ts.net:6443"
  audience:
    # invariant: hand-synced with `k3s_oidc_audience` in studio-infrastructure
    # (src/ansible/inventories/group_vars/all/k3s.yml): the apiserver accepts no other.
    description: Audience of the GitHub OIDC token presented to the API server
    default: "studio-infrastructure"

runs:
  using: composite
  steps:
    # invariant: no stored cluster credential. The job's own GitHub OIDC token IS the
    # identity (user github:<owner>/<repo>, see studio-infrastructure's
    # authentication.yaml.j2), fetched fresh by an exec plugin whenever kubectl
    # or helm needs one, so a long `--wait` never outlives its token. The
    # calling job must grant `id-token: write`.
    #
    # The CA comes from k3s' unauthenticated /cacerts over the tailnet, which is
    # already an authenticated network; that is what lets a repave regenerate
    # the CA without any app repo, secret or input changing.
    - name: Write the OIDC kubeconfig
      shell: bash
      env:
        API_SERVER: ${{ inputs.api-server }}
        AUDIENCE: ${{ inputs.audience }}
      run: |
        set -euo pipefail
        if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
          echo "::error::no OIDC token available: the calling job must grant 'permissions: id-token: write'"
          exit 1
        fi
        plugin="$RUNNER_TEMP/github-oidc-credential"
        cat > "$plugin" <<'PLUGIN'
        #!/usr/bin/env bash
        set -euo pipefail
        # outside: GitHub's token endpoint answers a passing 503 now and then (seen on
        # the first OIDC deploy, 2026-10-24), and kubectl/helm call this once per
        # process, several times per job.
        token=$(curl -sSf --retry 5 --retry-all-errors --retry-delay 2 -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$GITHUB_OIDC_AUDIENCE" | jq -r .value)
        # value: GitHub's tokens live longer than 4 minutes; asking again before
        # then costs one request and never presents an expired one.
        expires=$(date -u -d '+4 minutes' +%Y-%m-%dT%H:%M:%SZ)
        jq -n --arg t "$token" --arg e "$expires" \
          '{apiVersion: "client.authentication.k8s.io/v1", kind: "ExecCredential", status: {token: $t, expirationTimestamp: $e}}'
        PLUGIN
        chmod 700 "$plugin"
        ca=$(curl -sSfk "$API_SERVER/cacerts" | base64 -w0)
        cat > "$RUNNER_TEMP/kubeconfig" <<KUBECONFIG
        apiVersion: v1
        kind: Config
        clusters:
          - name: k3s
            cluster: {server: "$API_SERVER", certificate-authority-data: "$ca"}
        users:
          - name: github-oidc
            user:
              exec:
                apiVersion: client.authentication.k8s.io/v1
                command: "$plugin"
                interactiveMode: Never
                env: [{name: GITHUB_OIDC_AUDIENCE, value: "$AUDIENCE"}]
        contexts:
          - name: k3s
            context: {cluster: k3s, user: github-oidc}
        current-context: k3s
        KUBECONFIG
        chmod 600 "$RUNNER_TEMP/kubeconfig"
        echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"
        KUBECONFIG="$RUNNER_TEMP/kubeconfig" kubectl auth whoami
